s.com/css2?family=Cairo:wght@600;800&display=swap\" rel=\"stylesheet\">\n<style>\n*{box-sizing:border-box;font-family:'Cairo',sans-serif}\nbody{margin:0;background:#0f0f1e;color:white;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}\nh1{margin:8px 0 2px;font-size:18px}\n.sub{opacity:.6;font-size:11px;margin-bottom:8px;text-align:center;max-width:400px}\n.board-wrap{background:#1e1e36;border:3px solid #3a3a5a;border-radius:16px;padding:12px}\ncanvas{border-radius:12px;border:1px solid rgba(255,255,255,.1);touch-action:none;cursor:ew-resize;display:block}\n.hud{display:flex;gap:8px;margin:8px;font-size:12px;flex-wrap:wrap;justify-content:center}\n.hud span{padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}\n.timer.low{color:#ef4444;animation:blink .5s infinite}\n@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}\n.controls{display:flex;gap:8px;margin-top:10px}\n.btn{padding:7px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;background:#2d2d5a;color:white;font-size:12px}\n.btn.primary{background:#6c5cff}\n.levels{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:6px}\n.lv{width:30px;height:30px;border-radius:7px;background:#2a2a4a;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid transparent;cursor:pointer}\n.lv.active{border-color:#6c5cff;background:#6c5cff}\n.lv.done{background:#16a34a}\n</style>\n</head>\n<body>\n<h1>🍎 التقاط - نفس الفيزيائية + مؤقت وعداد مصلح</h1>\n<div class=\"sub\">نفس حجم السلة ونفس كمية الفواكه ونفس السرعة - بس المؤقت والعداد والفوز مصلحين + تحريك بالفارة على لابتوب</div>\n<div class=\"hud\" id=\"hud\"></div>\n<div class=\"levels\" id=\"levels\"></div>\n<div class=\"board-wrap\"><canvas id=\"c\" width=\"320\" height=\"300\"></canvas></div>\n<div class=\"controls\">\n<button class=\"btn primary\" onclick=\"reset()\">🔄 إعادة</button>\n<button class=\"btn\" onclick=\"nextLevel()\">التالي ⏭</button>\n</div>\n<div style=\"margin-top:8px;opacity:.5;font-size:10px;text-align:center\">حرك بالفارة على لابتوب • باللمس على تلفون • يمين/يسار بالكيبورد متاح</div>\n\n<script>\n// ===== نفس فيزيائية V6 الأصلية بالضبط =====\nlet level=1;\nlet score=0;\nlet timeLeft=40;\nlet finished=false;\nlet basketX=135;\nlet fruits=[];\nlet animId=null;\nlet timerId=null;\nlet lastSpawn=0;\nlet gameOver=false;\n\nconst canvas=document.getElementById('c');\nconst ctx=canvas.getContext('2d');\n\nfunction getLevelConfig(lv){\n  // العدد يزيد كل مرحلة +2: L1=12, L2=14...\n  let target = 12 + (lv-1)*2;\n  // الوقت: أول 10 مراحل 40 ثانية ثابت، بعدها ينقص ثانيتين كل مرحلة\n  let time;\n  if(lv<=10) time=40;\n  else time = Math.max(15, 40 - (lv-10)*2); // L11=38, L12=36...\n  return {target, time};\n}\n\nfunction startLevel(lv){\n  level=lv;\n  let cfg=getLevelConfig(level);\n  score=0;\n  timeLeft=cfg.time;\n  finished=false;\n  gameOver=false;\n  basketX=135;\n  fruits=[];\n  lastSpawn=0;\n  clearInterval(timerId);\n  cancelAnimationFrame(animId);\n  \n  // ===== المؤقت شغال 100% - إصلاح =====\n  timerId=setInterval(()=>{\n    if(finished || gameOver) return;\n    timeLeft-=1;\n    if(timeLeft<=0){\n      timeLeft=0;\n      finished=true;\n      gameOver=true;\n      clearInterval(timerId);\n      cancelAnimationFrame(animId);\n      checkWin();\n    }\n    renderHud();\n  },1000);\n  \n  renderHud();\n  renderLevels();\n  loop(0);\n}\n\nfunction loop(timestamp){\n  if(gameOver) return;\n  \n  // نفس منطق V6: كل 500ms فاكهة جديدة\n  if(timestamp - lastSpawn > 500){\n    lastSpawn=timestamp;\n    fruits.push({\n      x: Math.random()*280,\n      y: -20,\n      type: Math.random()<0.2 ? \"bomb\" : \"fruit\"\n    });\n  }\n  \n  // نفس السرعة V6: y += 3 + score*0.05\n  fruits.forEach(f=>f.y += 3 + score*0.05);\n  \n  // نفس منطق الالتقاط V6\n  fruits = fruits.filter(f=>{\n    if(f.y>260 && f.y<285 && f.x>basketX-10 && f.x<basketX+60){\n      if(f.type===\"bomb\"){\n        // قنبلة تنقص 2 (كنتِ طلبتي 2 مش 3)\n        score = Math.max(0, score-2);\n      } else {\n        score++;\n      }\n      renderHud();\n      // فحص فوز فوري\n      let cfg=getLevelConfig(level);\n      if(score>=cfg.target){\n        finished=true;\n        gameOver=true;\n        clearInterval(timerId);\n        cancelAnimationFrame(animId);\n        checkWin();\n        return false;\n      }\n      return false;\n    }\n    return f.y<310;\n  });\n  \n  // رسم - نفس V6\n  ctx.fillStyle=\"#0a0c1a\";\n  ctx.fillRect(0,0,320,300);\n  \n  // سلة\n  ctx.fillStyle=\"#fde68a\";\n  ctx.shadowColor=\"#fde68a\";\n  ctx.shadowBlur=12;\n  ctx.fillRect(basketX,270,50,16);\n  ctx.shadowBlur=0;\n  \n  // فواكه\n  fruits.forEach(f=>{\n    ctx.font=\"18px serif\";\n    ctx.fillText(f.type===\"bomb\"?\"💣\":\"🍎\", f.x, f.y);\n  });\n  \n  // فوز/خسارة\n  if(finished && gameOver){\n    ctx.fillStyle=\"rgba(0,0,0,.8)\";\n    ctx.fillRect(0,0,320,300);\n    ctx.fillStyle=\"white\";\n    ctx.font=\"bold 20px Cairo\";\n    ctx.textAlign=\"center\";\n    let cfg=getLevelConfig(level);\n    if(score>=cfg.target){\n      ctx.fillText(`🎉 فزت! ${score}/${cfg.target}`, 160, 130);\n      ctx.font=\"13px Cairo\";\n      ctx.fillText(`المستوى التالي: ${cfg.target+2} حبة بـ ${getLevelConfig(level+1).time}ث`, 160, 160);\n    } else {\n      ctx.fillText(`⏰ انتهى الوقت! ${score}/${cfg.target}`, 160, 140);\n    }\n    ctx.textAlign=\"left\";\n  }\n  \n  animId=requestAnimationFrame(loop);\n}\n\nfunction renderHud(){\n  let cfg=getLevelConfig(level);\n  let hud=document.getElementById('hud');\n  hud.innerHTML=`\n    <span>المستوى ${level}</span>\n    <span>🎯 ${score}/${cfg.target}</span>\n    <span class=\"timer ${timeLeft<=10?'low':''}\">⏱️ ${timeLeft}s</span>\n    <span>💣 -2</span>\n  `;\n}\nfunction renderLevels(){\n  let div=document.getElementById('levels');\n  div.innerHTML='';\n  for(let i=1;i<=20;i++){\n    let b=document.createElement('div');\n    b.className='lv'+(i===level?' active':'')+(i<level?' done':'');\n    b.textContent=i;\n    b.onclick=()=>startLevel(i);\n    div.appendChild(b);\n  }\n}\nfunction checkWin(){\n  let cfg=getLevelConfig(level);\n  if(score>=cfg.target){\n    // فوز - هنا نعطي عملات في الملف الكامل\n    console.log('WIN level', level);\n  } else {\n    console.log('LOSE');\n  }\n  // إعادة رسم للـ overlay\n  // loop متوقف، نرسم overlay يدوياً\n  setTimeout(()=>{\n    ctx.fillStyle=\"rgba(0,0,0,.8)\";\n    ctx.fillRect(0,0,320,300);\n    ctx.fillStyle=\"white\";\n    ctx.font=\"bold 20px Cairo\";\n    ctx.textAlign=\"center\";\n    if(score>=cfg.target){\n      ctx.fillText(`🎉 فزت! ${score}/${cfg.target}`, 160, 130);\n      ctx.font=\"13px Cairo\";\n      ctx.fillText(`اضغط التالي`, 160, 160);\n    } else {\n      ctx.fillText(`⏰ ${score}/${cfg.target}`, 160, 140);\n    }\n    ctx.textAlign=\"left\";\n  },50);\n}\nfunction reset(){ startLevel(level); }\nfunction nextLevel(){ startLevel(level+1); }\n\n// ===== تحريك بالفارة على لابتوب - نفس V6 =====\ncanvas.addEventListener('mousemove', (e)=>{\n  let rect=canvas.getBoundingClientRect();\n  let x=e.clientX-rect.left-25;\n  basketX=Math.max(0,Math.min(270,x));\n});\ncanvas.addEventListener('touchmove', (e)=>{\n  let rect=canvas.getBoundingClientRect();\n  let x=e.touches[0].clientX-rect.left-25;\n  basketX=Math.max(0,Math.min(270,x));\n  e.preventDefault();\n},{passive:false});\n\n// يمين/يسار بالكيبورد - متاح\ndocument.addEventListener('keydown', e=>{\n  if(e.key==='ArrowLeft') basketX=Math.max(0,basketX-18);\n  if(e.key==='ArrowRight') basketX=Math.min(270,basketX+18);\n});\n\nstartLevel(1);\n<\/script>\n</body>\n</html>\n",className:"w-full rounded-xl border border-white/10",style:{height:"520px",border:"0",display:"block",background:"#0f0f1e"},sandbox:"allow-scripts allow-same-origin"})}var Bn=[{id:"tictactoe",title:"إكس-أو",desc:"تحدى الذكاء الاصطناعي العشوائي في 3×3",icon:"⭕",reward:20,bg:"bg-gradient-to-br from-cyan-500/20 to-blue-500/20",component:Gu},{id:"memory",title:"الذا
